name: Regenerar artefatos finais

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-final-artifacts.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar ambiente local do pipeline
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=atividade4
          POSTGRES_USER=atividade4
          POSTGRES_PASSWORD=atividade4
          POSTGRES_HOST_PORT=5434
          EOF

      - name: Subir PostgreSQL
        run: docker compose up -d postgres

      - name: Construir imagens
        run: docker compose build ingest dbt

      - name: Executar ingestao RAW
        run: docker compose run --rm ingest

      - name: Executar dbt build
        run: docker compose run --rm dbt dbt build

      - name: Exportar Trusted e Delivery para Parquet
        run: |
          docker compose run --rm \
            -v "$PWD/data/trusted:/data/trusted" \
            -v "$PWD/data/delivery:/data/delivery" \
            ingest python scripts/export_parquet.py

      - name: Validar artefatos
        run: |
          python - <<'PY'
          import pandas as pd
          checks = {
              'data/trusted/reclamacoes.parquet': 918,
              'data/trusted/enquadramento.parquet': 1459,
              'data/trusted/glassdoor.parquet': 39,
              'data/delivery/tabela_final.parquet': 918,
          }
          for path, expected in checks.items():
              n = len(pd.read_parquet(path))
              print(f'{path}: {n}')
              assert n == expected, (path, n, expected)
          PY

      - name: Atualizar evidência da exportacao
        run: |
          {
            echo 'Artefatos Parquet regenerados no GitHub Actions.'
            echo 'trusted.reclamacoes: 918 linhas'
            echo 'trusted.enquadramento: 1459 linhas canonicas'
            echo 'trusted.glassdoor: 39 linhas'
            echo 'delivery.tabela_final: 918 linhas'
          } > evidencias/38_parquet_regenerado_final.txt

      - name: Remover workflow temporario
        run: rm .github/workflows/regenerate-final-artifacts.yml

      - name: Commit dos artefatos regenerados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trusted/*.parquet data/delivery/*.parquet evidencias/38_parquet_regenerado_final.txt .github/workflows/regenerate-final-artifacts.yml
          git commit -m 'Regenera artefatos Parquet finais' || exit 0
          git push
